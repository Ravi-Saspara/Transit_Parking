<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transit Building Parking Dashboard</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --danger-color: #e74c3c;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 450px; 
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }

        header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 24px;
        }

        header p {
            color: #7f8c8d;
            margin: 5px 0 0 0;
            font-size: 0.95rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            justify-content: center;
        }

        @media (max-width: 500px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Building Card Styling with height customization */
        .building-card {
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 15px; /* Compact padding */
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border-top: 5px solid var(--primary-color);
            
            /* --- HEIGHT CUSTOMIZATION --- */
            height: 150px;          /* Set the exact height you want here */
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Evenly spaces elements inside the height */
            box-sizing: border-box;
        }

        .building-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .building-name {
            font-size: 1.05rem; /* Balanced size for shorter cards */
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 5px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        /* Content wrapper helps adjust internal layouts smoothly */
        .card-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px; /* Tight spaces between text data */
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .data-label {
            color: #7f8c8d;
            font-weight: 500;
        }

        .data-value {
            font-weight: bold;
            color: #2c3e50;
        }

        /* Highlight Remaining Space */
        .remaining-space {
            background-color: #ebf5fb;
            padding: 6px 10px;
            border-radius: 6px;
            margin-top: 5px;
        }

        .remaining-space .data-value {
            color: var(--secondary-color);
            font-size: 1rem;
        }

        /* Warning if parking is getting full */
        .low-space .remaining-space {
            background-color: #fce4d6;
        }
        .low-space .remaining-space .data-value {
            color: var(--danger-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Transit Buildings Parking Monitor</h1>
            <p>Real-time space and occupancy overview</p>
        </header>

        <div class="dashboard-grid">

            <div class="building-card" data-total="150" data-parked="95">
                <h2 class="building-name">Hub - Bldg A</h2>
                <div class="card-content">
                    <div class="data-row">
                        <span class="data-label">Total:</span>
                        <span class="data-value total-val">150</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Parked:</span>
                        <span class="data-value parked-val">95</span>
                    </div>
                    <div class="data-row remaining-space">
                        <span class="data-label">Available:</span>
                        <span class="data-value remaining-val">0</span>
                    </div>
                </div>
            </div>

            <div class="building-card" data-total="200" data-parked="185">
                <h2 class="building-name">Hub - Bldg B</h2>
                <div class="card-content">
                    <div class="data-row">
                        <span class="data-label">Total:</span>
                        <span class="data-value total-val">200</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Parked:</span>
                        <span class="data-value parked-val">185</span>
                    </div>
                    <div class="data-row remaining-space">
                        <span class="data-label">Available:</span>
                        <span class="data-value remaining-val">0</span>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const cards = document.querySelectorAll('.building-card');
            
            cards.forEach(card => {
                const total = parseInt(card.getAttribute('data-total'));
                const parked = parseInt(card.getAttribute('data-parked'));
                const remaining = total - parked;
                
                card.querySelector('.remaining-val').textContent = remaining;
                
                if (remaining / total < 0.15) {
                    card.classList.add('low-space');
                }
            });
        });
    </script>
</body>
</html>
